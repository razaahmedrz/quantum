
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homework 4 - IBM Quantum Platform</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    .screenshot-container {
      width: 100%;
      margin: 30px 0;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .screenshot-container a {
      display: block;
      width: 150%;
    }

    .screenshot-container img {
      display: block;
      width: 100%;
      max-width: none;
      height: auto;
      cursor: zoom-in;
    }

    .zoom-hint {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .screenshot-container a {
        width: 200%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <a class="back-link" href="index.html">
      ← Back to Index
    </a>

    <h1 class="homework-title">Homework 4</h1>
    <p class="subtitle">IBM Quantum Platform</p>

    <!-- IBM Quantum Platform Screenshot -->
    <div class="screenshot-container">
      <a
        href="ibm_quantum.png"
        target="_blank"
        rel="noopener noreferrer"
        title="Click to view full-size screenshot"
      >
        <img
          src="ibm_quantum.png"
          alt="IBM Quantum Platform Dashboard Screenshot"
        />
      </a>
    </div>

    <p class="zoom-hint">
      Scroll horizontally to explore the screenshot.
      Click the image to view it at full size.
    </p>

  </main>
</body>
</html>
